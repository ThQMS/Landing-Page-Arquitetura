# Publica o site no GitHub Pages.
# O site e estatico: app.js ja vai compilado no repositorio, entao nao ha
# etapa de build aqui — o conteudo e enviado como esta.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite disparar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez. Nao cancela o que ja esta em andamento, para nao
# interromper uma publicacao pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
